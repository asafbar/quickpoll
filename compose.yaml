services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: quickpoll
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: quickpoll
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickpoll -d quickpoll"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data: